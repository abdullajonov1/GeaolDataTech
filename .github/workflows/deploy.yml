name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync files to deployment directory
        run: |
          rsync -a --delete --exclude='.git' --exclude='node_modules' ./ /var/www/geoldatatech/

      - name: Install, build, and restart
        run: |
          cd /var/www/geoldatatech
          npm ci
          npm run build
          if pm2 describe geoldatatech > /dev/null 2>&1; then
            pm2 restart geoldatatech
          else
            pm2 start npm --name geoldatatech -- start
          fi
          pm2 save
