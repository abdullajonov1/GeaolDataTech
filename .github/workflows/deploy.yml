name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync files to deployment directory
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='.env.production.local' \
            --exclude='storage/' \
            --exclude='public/uploads/' \
            ./ /var/www/geoldatatech/

      - name: Write Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: |
          cd /var/www/geoldatatech
          umask 077
          touch .env.production.local
          tmp=$(mktemp)
          grep -v -E '^(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|ADMIN_PASSWORD|ADMIN_SESSION_SECRET)=' .env.production.local > "$tmp" || true
          {
            cat "$tmp"
            [ -n "$TELEGRAM_BOT_TOKEN" ] && printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            [ -n "$TELEGRAM_CHAT_ID" ] && printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
            [ -n "$ADMIN_PASSWORD" ] && printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            [ -n "$ADMIN_SESSION_SECRET" ] && printf 'ADMIN_SESSION_SECRET=%s\n' "$ADMIN_SESSION_SECRET"
          } > .env.production.local
          rm -f "$tmp"

      - name: Install, build, and restart
        run: |
          cd /var/www/geoldatatech
          npm ci
          npm run build
          if pm2 describe geoldatatech > /dev/null 2>&1; then
            pm2 restart geoldatatech --update-env
          else
            pm2 start npm --name geoldatatech -- start
          fi
          pm2 save
